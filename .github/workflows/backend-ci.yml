name: Backend CI

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  api-verify:
    name: api verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airtable_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d airtable_demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airtable_demo?schema=public
      JWT_ACCESS_TOKEN_SECRET: test-secret-that-is-at-least-thirty-two-chars
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 1209600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Run quality gates
        run: pnpm quality:gates

      - name: Build
        run: pnpm build

      - name: Verify build entrypoint
        run: |
          test -f dist/src/main.js
          ls -la dist/src/main.js

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload OpenAPI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: api/docs/openapi.json

  api-scenarios:
    name: run api scenarios
    runs-on: ubuntu-latest
    needs: api-verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airtable_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d airtable_demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airtable_demo?schema=public
      JWT_ACCESS_TOKEN_SECRET: test-secret-that-is-at-least-thirty-two-chars
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 1209600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Build
        run: pnpm build

      - name: Verify build entrypoint
        run: |
          test -f dist/src/main.js
          ls -la dist/src/main.js

      - name: Seed database
        run: pnpm prisma:seed

      - name: Start API in background
        run: pnpm start:prod > /tmp/surp-api.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy in time"
          tail -n 200 /tmp/surp-api.log || true
          exit 1

      - name: Newman collection run
        run: pnpm postman:run

      - name: Print API logs on failure
        if: failure()
        run: tail -n 300 /tmp/surp-api.log || true
