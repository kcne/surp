name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run production build"
        required: false
        type: boolean
        default: true
  push:
    paths:
      - "ui/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  ui-verify:
    name: ui verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `next lint` does not type-check and the build only runs on push, so
      # without this a type error reaches master before anything catches it.
      - name: Type check
        run: pnpm exec tsc --noEmit

      # Covers the message catalogs too: an incomplete or divergent catalog
      # fails here rather than showing up as a Serbian string on an English
      # page, which nobody reports.
      - name: Unit tests
        run: pnpm test

  ui-build:
    name: ui build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ui-verify
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_build)

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
