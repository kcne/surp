name: Staging refresh CI

on:
  push:
    paths:
      - "ops/staging-refresh/**"
      - "api/prisma/**"
      - "api/package.json"
      - "api/pnpm-lock.yaml"
      - ".github/workflows/staging-refresh-ci.yml"
  pull_request:
    paths:
      - "ops/staging-refresh/**"
      - "api/prisma/**"
      - "api/package.json"
      - "api/pnpm-lock.yaml"
      - ".github/workflows/staging-refresh-ci.yml"

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build refresh image
        run: docker build -f ops/staging-refresh/Dockerfile -t surp-staging-refresh .
      - name: Start disposable PostgreSQL 18
        run: |
          docker network create surp-refresh-test
          docker run --detach --rm --name refresh-test-db --network surp-refresh-test \
            -e POSTGRES_PASSWORD=refresh-test-only postgres:18-alpine
          for attempt in {1..30}; do
            if docker exec refresh-test-db pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Restore and safety tests
        run: |
          docker run --rm --network surp-refresh-test --entrypoint python3 \
            -e TEST_DATABASE_URL=postgresql://postgres:refresh-test-only@refresh-test-db:5432/postgres \
            surp-staging-refresh -m unittest discover -s /app/refresh -p 'test_*.py' -v
      - name: Actual Prisma migrations
        run: |
          docker run --rm --network surp-refresh-test --entrypoint pnpm \
            -e DATABASE_URL=postgresql://postgres:refresh-test-only@refresh-test-db:5432/postgres \
            surp-staging-refresh prisma:migrate:deploy
      - name: Remove disposable database
        if: always()
        run: |
          docker stop refresh-test-db || true
          docker network rm surp-refresh-test || true
