services:
  postgres:
    # Keep local restores compatible with the production backup archive.
    image: postgres:18-alpine
    container_name: airtable-demo-postgres
    environment:
      POSTGRES_DB: airtable_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d airtable_demo']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airtable-demo-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/airtable_demo?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    command: sh -c "pnpm prisma migrate deploy && pnpm start:prod"

volumes:
  postgres_data:
